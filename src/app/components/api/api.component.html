
<!-- Div do botão CORS -->
<div class="text-center my-2 mt-2 mb-2">
  <span class="text-center">Antes de usar o cheater checker, habilite o CORS</span>
  <a href="https://cors-anywhere.herokuapp.com/corsdemo" 
     target="_blank" 
     rel="noopener noreferrer" 
     class="btn btn-primary btn2">Aqui</a>
</div>

<!-- Seção da barra de pesquisa -->
<div class="container-fluid text-center my-2">
  <div class="mx-auto mt-5 mb-5" style="max-width: 500px;">
    <div class="input-group">
      <!-- Input com label animado -->
      <div class="input-wrapper flex-grow-1">
        <input
          type="text"
          id="steamId"
          class="input"
          placeholder=" "
          [(ngModel)]="steamId"
        />
        <label for="steamId" class="label">Digite o Steam ID</label>
      </div>
      <!-- Botão de busca -->
      <button class="btn btn-primary btn-wide" (click)="buscarPerfil()">
        Buscar
      </button>
    </div>
  </div>
</div>

<!-- Seção do card do perfil -->
<div class="d-flex justify-content-center align-items-center">
  <div *ngIf="perfil" class="card custom-card" style="width: 18rem;">
    <!-- Imagem do avatar -->
    <img 
      [ngSrc]="perfil.avatarfull"
      alt="Avatar do jogador"
      class="card-img-top"
      width="60"
      height="180"
      loading="eager"
    />
    <!-- Corpo do card -->
    <div class="card-body text-center">
      <h5 class="card-title">Perfil do Jogador</h5>
      <p class="card-text"><strong>Nome:</strong> {{ perfil.personaname }}</p>
      <p class="card-text"><strong>Steam ID:</strong> {{ perfil.steamid }}</p>
      <p class="card-text">
        <strong>URL do Perfil:</strong>
        <a [href]="perfil.profileurl" target="_blank" class="btn btn-link">
          Visitar Perfil
        </a>
      </p>
    </div>
  </div>
</div>
