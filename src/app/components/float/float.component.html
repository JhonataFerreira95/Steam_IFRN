<div class="container mt-5 mb-5">
  <h2>Qualidade da Arma - CS:GO</h2>

  <!-- Input do valor float -->
  <div class="mb-3">
    <label for="floatValue" class="form-label">Digite o valor do Float</label>
    <input 
      type="number" 
      id="floatValue" 
      class="form-control" 
      placeholder="Ex: 0.12" 
      [(ngModel)]="floatValue" 
      step="0.01"
      min="0" 
      max="1">
  </div>

  <!-- Botão para verificar qualidade -->
  <button class="btn btn-primary" (click)="checkQuality()">Verificar Qualidade</button>

  <!-- Nova área para a imagem -->
  <div class="quality-image mt-2 text-center">
    <img src="/img/cs01.png" alt="p90" class="img-fluid">
  </div>

  <!-- Modal para Exibir a Qualidade -->
  <div 
    class="modal fade" 
    id="qualityModal" 
    tabindex="-1" 
    aria-labelledby="qualityModalLabel" 
    aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="qualityModalLabel">Qualidade da Arma</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- Body da caixa -->
          <p>Valor do Float: {{ floatValue }}</p>
          <p [ngClass]="qualityClass">{{ quality }}</p> <!-- Usando ngClass para definir a cor -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        </div>
      </div>
    </div>
  </div>
</div>
