<div class="card shadow-sm mb-5 mx-auto" style="max-width: 800px; width: 100%;">
    <div class="image-title">
      {{ img_card.nome }}
    </div>
  
    @if(img_card.iconUrl) {
      <img width="150" alt="Imagem do Card" [src]="img_card.iconUrl">
    }
    @else {
      <h2>Imagem não disponível</h2>
    }
  
    <div class="image-description">
      {{ img_card.description }}
    </div>
  
  </div>
